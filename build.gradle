plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
  	id "org.sonarqube" version "7.3.1.8318"
}

sonar {
	properties {
    	property "sonar.projectKey", "AGES-V-Stable_backend"
    	property "sonar.organization", "ages-v-stable"
    	property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
  }
}

group = 'ages.vstable'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation platform('software.amazon.awssdk:bom:2.55.14')
	implementation 'software.amazon.awssdk:secretsmanager'

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Security
	implementation 'org.springframework.security:spring-security-core:7.0.5'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

	constraints {
		['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each { module ->
			pitest("org.ow2.asm:${module}:9.11.1") {
				because 'Fixes CVE-2026-112046 in OW2 ASM 9.11 pulled transitively by PITest 1.30.1'
			}
		}
	}
}

abstract class MockitoAgentProvider implements CommandLineArgumentProvider {
	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract ConfigurableFileCollection getAgentJar()

	@Override
	Iterable<String> asArguments() {
		["-javaagent:${agentJar.asPath}"]
	}
}

tasks.named('test') {
	// Testes contra a instância de desenvolvimento da BlindPay só rodam em blindpaySandboxTest.
	useJUnitPlatform {
		excludeTags 'blindpay-sandbox'
	}
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes'
	jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
		agentJar.from(configurations.mockitoAgent)
	})
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('blindpaySandboxTest', Test) {
	description = 'Executa transferências reais na instância de DESENVOLVIMENTO da BlindPay (requer credenciais e Docker).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'blindpay-sandbox'
	}
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes'
	jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
		agentJar.from(configurations.mockitoAgent)
	})
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}

pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ages.vstable.backend.*']
	excludedClasses = [
		'ages.vstable.backend.BackendApplication',
		'ages.vstable.backend.DevelopmentDataSeeder',
		'ages.vstable.backend.config.CorsConfig',
		'ages.vstable.backend.configuration.LambdaSecretsEnvironmentPostProcessor',
		'ages.vstable.backend.repository.specification.*'
	]
	targetTests = [
		'ages.vstable.backend.*Test',
		'ages.vstable.backend.*Tests'
	]
	excludedGroups = ['blindpay-sandbox']
	excludedTestClasses = [
		'ages.vstable.backend.sandbox.*',
		'ages.vstable.backend.repository.*IntegrationTest',
		'ages.vstable.backend.service.*IntegrationTest',
		'ages.vstable.backend.external.*ContextTest',
		'ages.vstable.backend.logging.LoggingFormatTest'
	]
	avoidCallsTo = [
		'software.amazon.awssdk',
		'org.slf4j.Logger',
		'java.util.logging',
		'org.apache.logging.log4j',
		'org.apache.commons.logging'
	]
	reportDir.set(layout.buildDirectory.dir('reports/pitest'))
	timestampedReports = false
	outputFormats = ['HTML', 'XML']
	failWhenNoMutations = true
	threads.set(providers.provider { Math.min(8, Runtime.runtime.availableProcessors()) })
	jvmArgs.set(providers.provider {
		[
			"-javaagent:${configurations.mockitoAgent.asPath}".toString(),
			'-Dspring.profiles.active=test',
			'-DJWT_SECRET=test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes',
			'-DAVENIA_BASE_URL=http://127.0.0.1:0',
			'-DBLINDPAY_BASE_URL=http://127.0.0.1:0',
			'-DAPP_CONFIG_SECRET_ARN=',
			'-DTRANSFERS_RECONCILIATION_ENABLED=false'
		]
	})
}
