plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
  	id "org.sonarqube" version "7.3.1.8318"
}

sonar {
	properties {
    	property "sonar.projectKey", "AGES-V-Stable_backend"
    	property "sonar.organization", "ages-v-stable"
    	property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
  }
}

group = 'ages.vstable'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation platform('software.amazon.awssdk:bom:2.55.14')
	implementation 'software.amazon.awssdk:secretsmanager'

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Security
	implementation 'org.springframework.security:spring-security-core:7.0.5'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

	constraints {
		['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each { module ->
			pitest("org.ow2.asm:${module}:9.11.1") {
				because 'Fixes CVE-2026-112046 in OW2 ASM 9.11 pulled transitively by PITest 1.30.1'
			}
		}
	}
}

abstract class MockitoAgentProvider implements CommandLineArgumentProvider {
	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract ConfigurableFileCollection getAgentJar()

	@Override
	Iterable<String> asArguments() {
		["-javaagent:${agentJar.asPath}"]
	}
}

tasks.named('test') {
	// Testes contra a instância de desenvolvimento da BlindPay só rodam em blindpaySandboxTest.
	useJUnitPlatform {
		excludeTags 'blindpay-sandbox'
		excludeTags 'pentest-impact'
	}
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes'
	systemProperty 'TWO_FACTOR_ENCRYPTION_KEY', 'dGVzdC1vbmx5LTJmYS1rZXktMzItYnl0ZXMtbG9uZyE='
	systemProperty 'INVITATION_ENCRYPTION_KEY', 'dGVzdC1vbmx5LWludml0ZS1rZXktMzItYnl0ZXMhISE='
	systemProperty 'INVITATION_FRONTEND_ORIGIN', 'https://frontend.example'
	jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
		agentJar.from(configurations.mockitoAgent)
	})
	finalizedBy tasks.named('jacocoTestReport')
}

// cicd#86: provas locais de explorabilidade, separadas da regressão e dos sandboxes.
tasks.register('pentestImpactTest', Test) {
	description = 'Avalia cadeias de impacto locais com PostgreSQL efêmero e provedores simulados (cicd#86).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'pentest-impact' }
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes'
	systemProperty 'TWO_FACTOR_ENCRYPTION_KEY', 'dGVzdC1vbmx5LTJmYS1rZXktMzItYnl0ZXMtbG9uZyE='
	systemProperty 'INVITATION_ENCRYPTION_KEY', 'dGVzdC1vbmx5LWludml0ZS1rZXktMzItYnl0ZXMhISE='
	systemProperty 'INVITATION_FRONTEND_ORIGIN', 'https://frontend.example.test'
	systemProperty 'AVENIA_BASE_URL', 'http://127.0.0.1:0'
	systemProperty 'BLINDPAY_BASE_URL', 'http://127.0.0.1:0'
	['AVENIA_API_KEY', 'AVENIA_PRIVATE_KEY', 'BLINDPAY_API_KEY', 'APP_CONFIG_SECRET_ARN'].each {
		systemProperty it, ''
	}
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'TRANSFERS_RECONCILIATION_ENABLED', 'false'
	jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
		agentJar.from(configurations.mockitoAgent)
	})
	outputs.upToDateWhen { false }
	testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'short' }
}

tasks.register('blindpaySandboxTest', Test) {
	description = 'Executa transferências reais na instância de DESENVOLVIMENTO da BlindPay (requer credenciais e Docker).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'blindpay-sandbox'
	}
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes'
	jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
		agentJar.from(configurations.mockitoAgent)
	})
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}

pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ages.vstable.backend.*']
	excludedClasses = [
		'ages.vstable.backend.BackendApplication',
		'ages.vstable.backend.DevelopmentDataSeeder',
		'ages.vstable.backend.service.SyntheticDataSeeder',
		'ages.vstable.backend.config.CorsConfig',
		'ages.vstable.backend.configuration.QuoteConfiguration',
		'ages.vstable.backend.configuration.LambdaSecretsEnvironmentPostProcessor',
		'ages.vstable.backend.configuration.security.InternalJobSecurityConfiguration',
		'ages.vstable.backend.repository.specification.*'
	]
	targetTests = [
		'ages.vstable.backend.*Test',
		'ages.vstable.backend.*Tests'
	]
	excludedGroups = ['blindpay-sandbox', 'pentest-impact']
	excludedTestClasses = [
		'ages.vstable.backend.BackendApplicationTests',
		'ages.vstable.backend.DevelopmentDataSeederTest',
		'ages.vstable.backend.sandbox.*',
		'ages.vstable.backend.repository.*IntegrationTest',
		'ages.vstable.backend.service.*IntegrationTest',
		'ages.vstable.backend.controller.*IntegrationTest',
		'ages.vstable.backend.configuration.security.CompanyAuthorizationIntegrationTest',
		'ages.vstable.backend.external.*ContextTest',
		'ages.vstable.backend.logging.LoggingFormatTest'
	]
	avoidCallsTo = [
		'software.amazon.awssdk',
		'org.slf4j.Logger',
		'org.slf4j.spi.LoggingEventBuilder',
		'ages.vstable.backend.logging.OperationalLog',
		'java.util.logging',
		'org.apache.logging.log4j',
		'org.apache.commons.logging'
	]
	reportDir.set(layout.buildDirectory.dir('reports/pitest'))
	timestampedReports = false
	outputFormats = ['HTML', 'XML']
	failWhenNoMutations = true
	threads.set(providers.provider { Math.min(8, Runtime.runtime.availableProcessors()) })
	jvmArgs.set(providers.provider {
		[
			"-javaagent:${configurations.mockitoAgent.asPath}".toString(),
			'-Dspring.profiles.active=test',
			'-DJWT_SECRET=test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes',
			'-DTWO_FACTOR_ENCRYPTION_KEY=dGVzdC1vbmx5LTJmYS1rZXktMzItYnl0ZXMtbG9uZyE=',
			'-DINVITATION_ENCRYPTION_KEY=dGVzdC1vbmx5LWludml0ZS1rZXktMzItYnl0ZXMhISE=',
			'-DINVITATION_FRONTEND_ORIGIN=https://frontend.example',
			'-DAVENIA_BASE_URL=http://127.0.0.1:0',
			'-DBLINDPAY_BASE_URL=http://127.0.0.1:0',
			'-DAI_SUPPORT_GEMINI_BASE_URL=http://127.0.0.1:0',
			'-DAI_SUPPORT_DEEPSEEK_BASE_URL=http://127.0.0.1:0',
			'-DAPP_CONFIG_SECRET_ARN=',
			'-DTRANSFERS_RECONCILIATION_ENABLED=false'
		]
	})
}

tasks.named('pitest') {
	doLast {
		File xmlFile = layout.buildDirectory.file('reports/pitest/mutations.xml').get().asFile
		if (!xmlFile.exists()) {
			logger.lifecycle('PITest report not found at {}', xmlFile)
			return
		}
		def mutations = new groovy.xml.XmlSlurper().parse(xmlFile).mutation
		int total = mutations.size()
		int killed = mutations.count { it.@status.text() == 'KILLED' }
		int timedOut = mutations.count { it.@status.text() == 'TIMED_OUT' }
		int survived = mutations.count { it.@status.text() == 'SURVIVED' }
		int noCoverage = mutations.count { it.@status.text() == 'NO_COVERAGE' }
		int detected = killed + timedOut
		int covered = total - noCoverage
		int mutationPct = total > 0 ? Math.round((detected * 100.0f) / total) : 0
		int strengthPct = covered > 0 ? Math.round((detected * 100.0f) / covered) : 0

		def byPkg = [:].withDefault { [classes: [] as Set, total: 0, detected: 0, survived: 0, noCov: 0] }
		def byClass = [:].withDefault { [total: 0, detected: 0, survived: 0, noCov: 0] }
		mutations.each { m ->
			String cls = m.mutatedClass.text()
			String pkg = cls.contains('.') ? cls.substring(0, cls.lastIndexOf('.')) : cls
			String status = m.@status.text()
			byPkg[pkg].classes.add(cls)
			byPkg[pkg].total++
			byClass[cls].total++
			if (status == 'KILLED' || status == 'TIMED_OUT') {
				byPkg[pkg].detected++
				byClass[cls].detected++
			} else if (status == 'SURVIVED') {
				byPkg[pkg].survived++
				byClass[cls].survived++
			} else if (status == 'NO_COVERAGE') {
				byPkg[pkg].noCov++
				byClass[cls].noCov++
			}
		}

		logger.lifecycle('')
		logger.lifecycle('================================================================================')
		logger.lifecycle('PITEST MUTATION SUMMARY')
		logger.lifecycle('================================================================================')
		logger.lifecycle(String.format('Total Classes   : %d', byClass.size()))
		logger.lifecycle(String.format('Total Mutations : %d', total))
		logger.lifecycle(String.format('Mutation Score  : %d%% (%d/%d detected)', mutationPct, detected, total))
		logger.lifecycle(String.format('Test Strength   : %d%% (%d/%d covered)', strengthPct, detected, covered))
		logger.lifecycle(String.format('Status Breakdown: KILLED=%d | SURVIVED=%d | NO_COVERAGE=%d | TIMED_OUT=%d',
				killed, survived, noCoverage, timedOut))
		logger.lifecycle('--------------------------------------------------------------------------------')
		logger.lifecycle('Breakdown by Package:')
		byPkg.sort { it.key }.each { pkg, stats ->
			int pkgPct = stats.total > 0 ? Math.round((stats.detected * 100.0f) / stats.total) : 0
			String shortPkg = pkg.replace('ages.vstable.backend.', '')
			logger.lifecycle(String.format('  - %-32s | Classes: %2d | Score: %3d%% (%4d/%4d) | Survived: %3d | NoCov: %3d',
					shortPkg, stats.classes.size(), pkgPct, stats.detected, stats.total, stats.survived, stats.noCov))
		}
		logger.lifecycle('--------------------------------------------------------------------------------')

		def classesWithSurvivors = byClass.findAll { it.value.survived > 0 }
				.sort { a, b -> b.value.survived <=> a.value.survived ?: a.key <=> b.key }

		if (classesWithSurvivors.isEmpty()) {
			logger.lifecycle('No surviving mutations!')
		} else {
			logger.lifecycle(String.format('Classes with Surviving Mutations (%d classes, %d survivors):',
					classesWithSurvivors.size(), survived))
			classesWithSurvivors.each { cls, stats ->
				int clsPct = stats.total > 0 ? Math.round((stats.detected * 100.0f) / stats.total) : 0
				String shortName = cls.replace('ages.vstable.backend.', '')
				logger.lifecycle(String.format('  - %-52s | Survived: %2d | NoCov: %2d | Score: %3d%% (%d/%d)',
						shortName, stats.survived, stats.noCov, clsPct, stats.detected, stats.total))
			}
		}
		logger.lifecycle('================================================================================')

		String stepSummaryPath = System.getenv('GITHUB_STEP_SUMMARY')
		if (stepSummaryPath) {
			File summaryFile = new File(stepSummaryPath)
			StringBuilder md = new StringBuilder()
			md.append('## PITest Mutation Analysis Summary\n\n')
			md.append('| Metric | Value |\n| :--- | :--- |\n')
			md.append("| **Classes Evaluated** | ${byClass.size()} |\n")
			md.append("| **Mutation Coverage** | **${mutationPct}%** (${detected}/${total}) |\n")
			md.append("| **Test Strength** | **${strengthPct}%** (${detected}/${covered}) |\n")
			md.append("| **Killed / Timed Out** | ${killed} / ${timedOut} |\n")
			md.append("| **Survived** | **${survived}** |\n")
			md.append("| **No Coverage** | ${noCoverage} |\n\n")
			md.append('### Breakdown by Package\n\n')
			md.append('| Package | Classes | Mutation Score | Survived | No Coverage |\n| :--- | :---: | :---: | :---: | :---: |\n')
			byPkg.sort { it.key }.each { pkg, stats ->
				int pkgPct = stats.total > 0 ? Math.round((stats.detected * 100.0f) / stats.total) : 0
				String shortPkg = pkg.replace('ages.vstable.backend.', '')
				md.append("| `${shortPkg}` | ${stats.classes.size()} | ${pkgPct}% (${stats.detected}/${stats.total}) | ${stats.survived} | ${stats.noCov} |\n")
			}
			summaryFile.append(md.toString(), 'UTF-8')
		}
	}
}
