server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_SCHEMA:db}?allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  avenia:
    base-url: ${AVENIA_BASE_URL:https://api.sandbox.avenia.io:10952}
    api-key: ${AVENIA_API_KEY:}
    private-key: ${AVENIA_PRIVATE_KEY:}

api:
  auth:
    jwt:
      secret: ${JWT_SECRET:lR4kEZSOXyCXvzbmgrfLAmSWKtHJnCZ6fJLp5Pm/980a5xogpjaahKGuLPou8P8647IQthO/iX61VWueFl00hA==}
    header:
      name: X-AUTH-API-SECRET-KEY
