logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ages.vstable.backend: ${LOG_LEVEL_APP:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.hibernate: INFO
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.web.client: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: "OFF"
    org.apache.hc.client5.http: INFO
    org.apache.hc.client5.http.wire: "OFF"
    org.apache.hc.client5.http.headers: "OFF"
    reactor.netty.http.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-none} %kvp %msg%n"

server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_SCHEMA:db}?sslmode=${DB_SSL_MODE:disable}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      data-source-properties:
        # O PostgreSQL anexa à mensagem de erro os valores da linha ("Key (...)=(e-mail) already exists"),
        # e o Hibernate registra essa mensagem; sem isso, dados pessoais iriam para os logs.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Documentos de compliance da BlindPay têm no máximo 3MB.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  # Timeouts dos clientes HTTP de saída (Avenia e BlindPay). Sem eles, um provedor
  # lento prende a thread da requisição indefinidamente.
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:30s}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  invitation:
    # Chave AES de 32 bytes em Base64 (fora do banco) e origem pública do frontend de cada ambiente.
    encryption-key: ${INVITATION_ENCRYPTION_KEY}
    key-version: ${INVITATION_KEY_VERSION:v1}
    frontend-origin: ${INVITATION_FRONTEND_ORIGIN}
    rate-limit:
      # Proxies confiáveis que acrescentam ao X-Forwarded-For (veja ClientIpResolver). 0 ignora o cabeçalho.
      trusted-proxy-hops: ${INVITATION_RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
  # Termos aceitos no aceite do convite. Trocar a versão exige novo aceite de quem ainda não aceitou.
  # Os padrões abaixo são só para desenvolvimento; o perfil lambda exige valores explícitos.
  terms:
    version: ${TERMS_VERSION:v1}
    terms-url: ${TERMS_URL:${INVITATION_FRONTEND_ORIGIN}/termos-de-uso}
    privacy-url: ${PRIVACY_URL:${INVITATION_FRONTEND_ORIGIN}/politica-de-privacidade}

api:
  auth:
    jwt:
      secret: ${JWT_SECRET}
    two-factor:
      encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY}

avenia:
  base-url: ${AVENIA_BASE_URL:https://api.sandbox.avenia.io:10952}
  api-key: ${AVENIA_API_KEY:}
  private-key: ${AVENIA_PRIVATE_KEY:}
  email: ${AVENIA_EMAIL:}
  password: ${AVENIA_PASSWORD:}
  webhook-url: ${AVENIA_WEBHOOK_URL:}

blindpay:
  base-url: ${BLINDPAY_BASE_URL:https://api.blindpay.com}
  api-key: ${BLINDPAY_API_KEY:}
  instance-id: ${BLINDPAY_INSTANCE_ID:}
  webhook-secret: ${BLINDPAY_WEBHOOK_SECRET:}
  tos-redirect-url: ${BLINDPAY_TOS_REDIRECT_URL:}

quotes:
  provider-timeout: ${QUOTE_PROVIDER_TIMEOUT:10s}
  avenia:
    # Prazo para confirmar uma oferta da Avenia; a execução recota e recusa preço pior.
    confirmation-window: ${QUOTE_AVENIA_CONFIRMATION_WINDOW:60s}

# Cotações de referência do dashboard (cicd#55): cache no banco, atualizado na leitura
# quando passa do TTL. Só rotas que a Avenia cota neste sistema (BRL entra via PIX e sai
# em token numa rede de carteira); a taxa exibida é o basePrice, sem tarifas.
exchange-rates:
  ttl: ${EXCHANGE_RATES_TTL:2h}
  provider-timeout: ${EXCHANGE_RATES_PROVIDER_TIMEOUT:5s}
  reference-amount: ${EXCHANGE_RATES_REFERENCE_AMOUNT:1000}
  pairs:
    - base-currency: BRL
      quote-currency: USDC
      input-payment-method: PIX
      output-payment-method: POLYGON
    - base-currency: BRL
      quote-currency: USDT
      input-payment-method: PIX
      output-payment-method: POLYGON

# Economia estimada do dashboard: custo de câmbio bancário de referência, em pontos percentuais.
dashboard:
  savings:
    reference-spread-percentage: ${DASHBOARD_SAVINGS_REFERENCE_SPREAD_PERCENTAGE:4.00}

# Conciliação das transferências BlindPay: retoma execuções paradas (webhook perdido,
# chamada sem resposta) repetindo cada etapa com a mesma chave de idempotência.
transfers:
  reconciliation:
    enabled: ${TRANSFERS_RECONCILIATION_ENABLED:true}
    interval: ${TRANSFERS_RECONCILIATION_INTERVAL:30s}
    stale-after: ${TRANSFERS_RECONCILIATION_STALE_AFTER:30s}
    batch-size: ${TRANSFERS_RECONCILIATION_BATCH_SIZE:50}

ai:
  support:
    provider: ${AI_SUPPORT_PROVIDER:gemini}
    api-key: ${AI_SUPPORT_API_KEY:}
    gemini-model: ${AI_SUPPORT_GEMINI_MODEL:gemini-flash-lite-latest}
    gemini-base-url: ${AI_SUPPORT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    deepseek-model: ${AI_SUPPORT_DEEPSEEK_MODEL:deepseek-chat}
    deepseek-base-url: ${AI_SUPPORT_DEEPSEEK_BASE_URL:https://api.deepseek.com}

---
spring:
  config:
    activate:
      on-profile: dev

app:
  seed:
    password: ${DEV_SEED_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: lambda
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_SCHEMA}?sslmode=verify-full&sslrootcert=/usr/local/share/ca-certificates/rds-global-bundle.pem
    hikari:
      maximum-pool-size: 2
  flyway:
    enabled: false

# Sem padrão na Lambda: a aplicação não sobe sem a versão publicada dos termos e sem a topologia de proxies
# definida para o ambiente, para que valores provisórios nunca sejam usados em staging ou produção.
app:
  invitation:
    rate-limit:
      trusted-proxy-hops: ${INVITATION_RATE_LIMIT_TRUSTED_PROXY_HOPS}
  terms:
    version: ${TERMS_VERSION}
    terms-url: ${TERMS_URL}
    privacy-url: ${PRIVACY_URL}

---
spring:
  config:
    activate:
      on-profile: migration
  jpa:
    hibernate:
      ddl-auto: none
