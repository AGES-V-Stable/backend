server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_SCHEMA:db}?allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Timeouts dos clientes HTTP de saída (Avenia e BlindPay). Sem eles, um provedor
  # lento prende a thread da requisição indefinidamente.
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:30s}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

api:
  auth:
    jwt:
      secret: ${JWT_SECRET:lR4kEZSOXyCXvzbmgrfLAmSWKtHJnCZ6fJLp5Pm/980a5xogpjaahKGuLPou8P8647IQthO/iX61VWueFl00hA==}

avenia:
  base-url: ${AVENIA_BASE_URL:https://api.sandbox.avenia.io:10952}
  api-key: ${AVENIA_API_KEY:}
  private-key: ${AVENIA_PRIVATE_KEY:}
  email: ${AVENIA_EMAIL:}
  password: ${AVENIA_PASSWORD:}
  webhook-url: ${AVENIA_WEBHOOK_URL:}

blindpay:
  base-url: ${BLINDPAY_BASE_URL:https://api.blindpay.com}
  api-key: ${BLINDPAY_API_KEY:}
  instance-id: ${BLINDPAY_INSTANCE_ID:}
  webhook-secret: ${BLINDPAY_WEBHOOK_SECRET:}

quotes:
  provider-timeout: ${QUOTE_PROVIDER_TIMEOUT:10s}

---
spring:
  config:
    activate:
      on-profile: dev

app:
  seed:
    password: ${DEV_SEED_PASSWORD:}
