name: Deploy backend

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deploy-${{ github.event_name == 'push' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  avenia-mcp-server:
    name: Avenia MCP Server
    uses: ./.github/workflows/avenia-mcp-server.yml

  deploy:
    if: github.event_name == 'push' || (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || 'production' }}
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      BACKEND_LAMBDA_FUNCTION_NAME: ${{ vars.BACKEND_LAMBDA_FUNCTION_NAME }}
      MIGRATION_LAMBDA_FUNCTION_NAME: ${{ vars.MIGRATION_LAMBDA_FUNCTION_NAME }}
      SEED_LAMBDA_FUNCTION_NAME: ${{ vars.SEED_LAMBDA_FUNCTION_NAME }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
        env:
          JWT_SECRET: test-only-jwt-secret-do-not-use-in-production-hs512-needs-at-least-64-bytes
          AVENIA_EMAIL: test@example.com
          AVENIA_PASSWORD: test-only-not-a-real-credential
          AVENIA_WEBHOOK_URL: https://example.com/webhooks/avenia
          BLINDPAY_BASE_URL: https://example.com
          BLINDPAY_API_KEY: test-only-not-a-real-credential
          BLINDPAY_INSTANCE_ID: in_000000000000
          BLINDPAY_WEBHOOK_SECRET: test-only-not-a-real-credential

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Build and push Lambda image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build --platform linux/amd64 --provenance=false -f Dockerfile.lambda \
            -t "${ECR_REPOSITORY}:${tag}" --metadata-file "$RUNNER_TEMP/image-metadata.json" --push .
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/image-metadata.json")"
          echo "uri=${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Update and run database migrations
        shell: bash
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$MIGRATION_LAMBDA_FUNCTION_NAME" \
            --image-uri '${{ steps.image.outputs.uri }}' > /dev/null
          aws lambda wait function-updated --function-name "$MIGRATION_LAMBDA_FUNCTION_NAME"
          response="$RUNNER_TEMP/migration-response.json"
          metadata="$RUNNER_TEMP/migration-invocation.json"
          aws lambda invoke --function-name "$MIGRATION_LAMBDA_FUNCTION_NAME" \
            --invocation-type RequestResponse --cli-binary-format raw-in-base64-out \
            --payload '{}' "$response" > "$metadata"
          python3 - "$metadata" "$response" <<'PY'
          import json, sys
          try:
              metadata = json.load(open(sys.argv[1], encoding='utf-8'))
              response = json.load(open(sys.argv[2], encoding='utf-8'))
              if metadata.get('StatusCode') != 200 or metadata.get('FunctionError') or response.get('status') != 'migrated':
                  raise ValueError()
          except (OSError, ValueError, TypeError, AttributeError):
              sys.exit('Database migration failed; inspect the migration Lambda logs')
          PY

      - name: Seed the first staging administrator
        if: github.event_name == 'push'
        shell: bash
        env:
          INITIAL_ADMIN_NAME: ${{ vars.INITIAL_ADMIN_NAME }}
          INITIAL_ADMIN_EMAIL: ${{ vars.INITIAL_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SEED_LAMBDA_FUNCTION_NAME:?Set SEED_LAMBDA_FUNCTION_NAME in the staging GitHub Environment}"
          : "${INITIAL_ADMIN_NAME:?Set INITIAL_ADMIN_NAME in the staging GitHub Environment}"
          : "${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in the staging GitHub Environment}"
          : "${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD as a staging GitHub secret}"
          aws lambda update-function-code --function-name "$SEED_LAMBDA_FUNCTION_NAME" \
            --image-uri '${{ steps.image.outputs.uri }}' > /dev/null
          aws lambda wait function-updated --function-name "$SEED_LAMBDA_FUNCTION_NAME"
          umask 077
          payload="$(mktemp "$RUNNER_TEMP/initial-admin.XXXXXX.json")"
          trap 'rm -f "$payload"' EXIT
          python3 - "$payload" <<'PY'
          import json, os, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as output:
              json.dump({
                  'fullName': os.environ['INITIAL_ADMIN_NAME'],
                  'email': os.environ['INITIAL_ADMIN_EMAIL'],
                  'password': os.environ['INITIAL_ADMIN_PASSWORD'],
              }, output)
          PY
          response="$RUNNER_TEMP/seed-response.json"
          metadata="$RUNNER_TEMP/seed-invocation.json"
          aws lambda invoke --function-name "$SEED_LAMBDA_FUNCTION_NAME" \
            --invocation-type RequestResponse --cli-binary-format raw-in-base64-out \
            --payload "fileb://$payload" "$response" > "$metadata"
          python3 - "$metadata" "$response" <<'PY'
          import json, sys
          try:
              metadata = json.load(open(sys.argv[1], encoding='utf-8'))
              response = json.load(open(sys.argv[2], encoding='utf-8'))
              if metadata.get('StatusCode') != 200 or metadata.get('FunctionError') or response.get('status') not in ('seeded', 'already_exists'):
                  raise ValueError()
          except (OSError, ValueError, TypeError, AttributeError):
              sys.exit('Initial administrator seed failed; inspect the seed Lambda logs')
          PY

      - name: Update public API Lambda
        run: |
          aws lambda update-function-code --function-name "$BACKEND_LAMBDA_FUNCTION_NAME" \
            --image-uri '${{ steps.image.outputs.uri }}' > /dev/null
          aws lambda wait function-updated --function-name "$BACKEND_LAMBDA_FUNCTION_NAME"

      - name: Verify protected API route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
              "${API_URL%/}/v1/auth/login" || true)"
            if [[ "$status" == 401 ]]; then exit 0; fi
            sleep 5
          done
          echo 'Protected API route did not return 401' >&2
          exit 1
